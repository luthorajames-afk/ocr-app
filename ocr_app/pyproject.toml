[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aocri"
version = "1.0.0"
description = "AOCRI — Advanced Optical Character Recognition for Itamba. Application OCR hors ligne par Kriesty Solutions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kriesty Solutions" }]
license = { text = "Proprietary" }
dependencies = [
    "pypdfium2",
    "pillow",
    "numpy",
]

[project.optional-dependencies]
simple = ["tesserocr"]
medium = ["rapidocr", "opencv-python-headless"]
advanced = ["docling"]
ui = ["pyside6"]
dev = ["pytest", "pyinstaller"]

[project.scripts]
aocri = "ocr_app.cli:main"
ocr-app = "ocr_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]