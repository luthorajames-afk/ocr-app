[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-app"
version = "1.0.0"
description = "Application OCR hors ligne (Windows) — OCR avancé avec conservation de la mise en page"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Elvis" }]
license = { text = "Proprietary" }
dependencies = [
    "pypdfium2",
    "pillow",
    "numpy",
]

[project.optional-dependencies]
simple = ["tesserocr"]
medium = ["rapidocr-onnxruntime", "opencv-python-headless"]
advanced = ["docling"]
ui = ["pyside6"]
dev = ["pytest", "pyinstaller"]

[project.scripts]
ocr-app = "ocr_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]